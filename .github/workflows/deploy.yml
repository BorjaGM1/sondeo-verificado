# Único camino a producción: cada push a main pasa los tests y se despliega desde aquí.
# Los logs son públicos: cualquiera puede ver qué commit está desplegado y las huellas
# SHA-256 de lo que se sirve al navegador, y compararlas con lo que recibe.
name: Test y deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migraciones D1
        run: npx wrangler d1 migrations apply sondeo-verificado --remote
      - name: Deploy
        run: npx wrangler deploy
      - name: Huellas de lo que se sirve al navegador
        run: |
          echo "Commit desplegado: $GITHUB_SHA"
          sha256sum public/index.html public/app.js public/vendor/autoscript.js
          echo "Compáralas con: curl -s https://sondeo-verificado.borjitaea.workers.dev/app.js | sha256sum"
